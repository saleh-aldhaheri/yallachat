services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - app
            - reverb
        networks:
            - yalla-chat

    app:
        image: salehaldhaheri1010/yallachat:production
        restart: unless-stopped
        command: php artisan octane:frankenphp --host=0.0.0.0 --port=8000
        environment:
            RUN_OPTIMIZE: "true"
        env_file:
            - .env.production
        expose:
            - "8000"
        volumes:
            - app_storage:/app/storage
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 40s
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        networks:
            - yalla-chat

    reverb:
        image: salehaldhaheri1010/yallachat:production
        restart: unless-stopped
        command: php artisan reverb:start
        env_file:
            - .env.production
        environment:
            REVERB_SERVER_HOST: "0.0.0.0"
        expose:
            - "8080"
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        networks:
            - yalla-chat

    horizon:
        image: salehaldhaheri1010/yallachat:production
        restart: unless-stopped
        command: php artisan horizon
        env_file:
            - .env.production
        healthcheck:
            test: ["CMD", "php", "artisan", "horizon:status"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        networks:
            - yalla-chat

    scheduler:
        image: salehaldhaheri1010/yallachat:production
        restart: unless-stopped
        command: php artisan schedule:work
        env_file:
            - .env.production
        healthcheck:
            test: ["CMD", "php", "-r", "exit(0)"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        networks:
            - yalla-chat

    migrate:
        image: salehaldhaheri1010/yallachat:production
        command: php artisan migrate --force
        env_file:
            - .env.production
        environment:
            RUN_OPTIMIZE: "false"
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - yalla-chat

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: yalla_chat
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP -uroot -p$${MYSQL_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s
        networks:
            - yalla-chat

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - yalla-chat

volumes:
    mysql_data:
    redis_data:
    app_storage:
    caddy_data:
    caddy_config:

networks:
    yalla-chat:
        driver: bridge
